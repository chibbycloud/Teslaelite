<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Withdraw | teslastockllc</title>

    <link rel="stylesheet" href="../style.css">
    <script src="../script.js" defer></script>
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <a href="../index.html" class="logo">
            tesla<span>stock</span>llc.
        </a>

        <h1>Withdrawal Request</h1>

        <p>Contact our support team about your withdrawal.</p>

        <form id="withdrawForm"
              onsubmit="event.preventDefault(); openSupport('Hello, I need assistance with a withdrawal request. Please guide me through the process.');">

            <div class="form-group">

                <label>Withdrawal Method</label>

                <select id="withdrawMethod" required>
                    <option value="">Choose method</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                    <option value="Bitcoin">Bitcoin</option>
                    <option value="Ethereum">Ethereum</option>
                    <option value="USDC">USDC</option>
                </select>

            </div>

            <div class="form-group">

                <label>Amount</label>

                <input
                    type="number"
                    id="withdrawAmount"
                    min="1"
                    step="any"
                    placeholder="Enter amount"
                    required>

            </div>

            <div class="form-group">

                <label>Currency</label>

                <select id="withdrawCurrency" required>
                    <option value="">Choose currency</option>
                    <option value="USD">USD</option>
                    <option value="NGN">NGN</option>
                </select>

            </div>

            <p class="form-message">
                For your security, do not share passwords,
                private keys or sensitive banking details in live chat.
            </p>

            <button class="btn btn-gold full-width" type="submit">
                Submit Request
            </button>

            <p id="withdrawMessage" class="form-message"></p>

        </form>

        <div class="auth-footer">
            <a href="dashboard.html">Back to Dashboard</a>
        </div>

    </div>

</div>

<!-- Smartsupp Live Chat -->

var _smartsupp = _smartsupp || {};

_smartsupp.key = '58d624c89d3c921bb6a361cc09b33910e4ff1250';

window.smartsupp || (function(d) {

    var s, c, o = smartsupp = function() {
        o._.push(arguments);
    };

    o._ = [];

    s = d.getElementsByTagName('script')[0];
    c = d.createElement('script');

    c.type = 'text/javascript';
    c.charset = 'utf-8';
    c.async = true;

    c.src = 'https://www.smartsuppchat.com/loader.js?';

    s.parentNode.insertBefore(c, s);

})(document);

</script>

</body>
</html>
