<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MILLER - Deposits</title>

<link rel="stylesheet" href="../style.css">

<style>
body {
    background: #080d18;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}
.container {
    max-width: 1100px;
    margin: auto;
}
h1 { color: #d4af37; }
.card {
    background: #141d2e;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}
th, td {
    padding: 13px;
    border-bottom: 1px solid #29354a;
    text-align: left;
}
th { color: #d4af37; }
button {
    padding: 8px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
.approve { background: #16834a; color: white; }
.reject { background: #c0392b; color: white; }
.back {
    color: #d4af37;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<a href="dashboard.html" class="back">← Admin Dashboard</a>

<h1>Deposit Management</h1>
<p>Manage and review user deposit requests.</p>

<div class="card">
<h3>Deposit Overview</h3>
<p>Total Deposits: <strong id="total">₦0</strong></p>
<p>Pending Requests: <strong id="pending">0</strong></p>
</div>

<div class="card">
<h3>Deposit Requests</h3>

<div style="overflow-x:auto;">
<table>
<thead>
<tr>
<th>User</th>
<th>Amount</th>
<th>Method</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="depositList">
<tr>
<td colspan="5">No deposit records available.</td>
</tr>
</tbody>
</table>
</div>

</div>
</div>

<script>
function loadDeposits() {
    const deposits = JSON.parse(
        localStorage.getItem("millerDeposits") || "[]"
    );

    const list = document.getElementById("depositList");

    let pending = 0;
    let total = 0;

    if (!deposits.length) {
        list.innerHTML = `
        <tr>
        <td colspan="5">No deposit requests yet.</td>
        </tr>`;
    } else {
        list.innerHTML = deposits.map((d, i) => {
            if (d.status === "Pending") pending++;
            if (d.status === "Approved") total += Number(d.amount);

            return `
            <tr>
            <td>${d.user || "User"}</td>
            <td>₦${Number(d.amount).toLocaleString()}</td>
            <td>${d.method || "N/A"}</td>
            <td>${d.status}</td>
            <td>
            ${d.status === "Pending" ? `
            <button class="approve" onclick="updateDeposit(${i}, 'Approved')">Approve</button>
            <button class="reject" onclick="updateDeposit(${i}, 'Rejected')">Reject</button>
            ` : "Completed"}
            </td>
            </tr>`;
        }).join("");
    }

    document.getElementById("total").textContent =
        "₦" + total.toLocaleString();

    document.getElementById("pending").textContent = pending;
}

function updateDeposit(index, status) {
    const deposits = JSON.parse(
        localStorage.getItem("millerDeposits") || "[]"
    );

    deposits[index].status = status;

    localStorage.setItem("millerDeposits", JSON.stringify(deposits));

    loadDeposits();
}

loadDeposits();
</script>

</body>
</html>
