<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MILLER - Withdrawals</title>
<link rel="stylesheet" href="../style.css">

<style>
body {
    background: #080d18;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}
.container {
    max-width: 1100px;
    margin: auto;
}
h1 { color: #d4af37; }
.card {
    background: #141d2e;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}
th, td {
    padding: 13px;
    border-bottom: 1px solid #29354a;
    text-align: left;
}
th { color: #d4af37; }
button {
    padding: 8px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin: 2px;
}
.approve { background: #16834a; color: white; }
.reject { background: #c0392b; color: white; }
.back { color: #d4af37; text-decoration: none; }
</style>
</head>

<body>

<div class="container">

<a href="dashboard.html" class="back">← Admin Dashboard</a>

<h1>Withdrawal Management</h1>
<p>Review withdrawal requests.</p>

<div class="card">
<h3>Withdrawal Overview</h3>
<p>Total Approved: <strong id="total">₦0</strong></p>
<p>Pending Requests: <strong id="pending">0</strong></p>
</div>

<div class="card">
<h3>Withdrawal Requests</h3>

<div style="overflow-x:auto;">
<table>
<thead>
<tr>
<th>User</th>
<th>Amount</th>
<th>Bank</th>
<th>Account</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="withdrawalList">
<tr>
<td colspan="6">No withdrawal records available.</td>
</tr>
</tbody>
</table>
</div>
</div>

</div>

<script>
function loadWithdrawals() {

const withdrawals = JSON.parse(
localStorage.getItem("millerWithdrawals") || "[]"
);

const list = document.getElementById("withdrawalList");

let pending = 0;
let total = 0;

if (!withdrawals.length) {

list.innerHTML = `
<tr>
<td colspan="6">No withdrawal requests yet.</td>
</tr>`;

} else {

list.innerHTML = withdrawals.map((w, i) => {

if (w.status === "Pending") pending++;

if (w.status === "Approved") {
total += Number(w.amount);
}

return `
<tr>
<td>${w.user || "User"}</td>
<td>₦${Number(w.amount).toLocaleString()}</td>
<td>${w.bank || "N/A"}</td>
<td>${w.account || "N/A"}</td>
<td>${w.status}</td>
<td>
${w.status === "Pending" ? `
<button class="approve"
onclick="updateWithdrawal(${i}, 'Approved')">
Approve
</button>

<button class="reject"
onclick="updateWithdrawal(${i}, 'Rejected')">
Reject
</button>
` : "Completed"}
</td>
</tr>`;

}).join("");

}

document.getElementById("total").textContent =
"₦" + total.toLocaleString();

document.getElementById("pending").textContent = pending;

}

function updateWithdrawal(index, status) {

const withdrawals = JSON.parse(
localStorage.getItem("millerWithdrawals") || "[]"
);

withdrawals[index].status = status;

localStorage.setItem(
"millerWithdrawals",
JSON.stringify(withdrawals)
);

loadWithdrawals();

}

loadWithdrawals();
</script>

</body>
</html>
