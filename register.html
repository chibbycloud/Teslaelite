<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | teslastockllc</title>

    <link rel="stylesheet" href="../style.css">
    <script src="../script.js" defer></script>
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <a href="../index.html" class="logo">
            tesla<span>stock</span>llc.
        </a>

        <h1>Create Your Account</h1>

        <p>Register to access your teslastockllc account.</p>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required>
            </div>

            <div class="form-check">

                <input type="checkbox" id="terms" required>

                <label for="terms">
                    I agree to the platform's Terms and Conditions
                    and Privacy Policy.
                </label>

            </div>

            <button type="submit" class="btn btn-gold full-width">
                Create Account
            </button>

            <p id="registerMessage" class="form-message"></p>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <div class="auth-footer">
            <a href="../index.html">← Back to Homepage</a>
        </div>

    </div>

</div>
